name: Build APK
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pub get + local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build debug APK (arm64)
        run: tooling/build-apk.sh --debug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dsh-go-arm64-debug
          path: app/build/app/outputs/flutter-apk/app-arm64-debug.apk
          retention-days: 7
